[project]
name = "kafka_excel_sim"
version = "0.2.0"
description = "Kafka message simulator with settings provided by an Excel file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10,<4",
    "confluent-kafka>=2.14.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
kafka-excel-sim = "kafka_excel_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_excel_sim"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]